name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java ${{ matrix.runtime }} (verify on JDK ${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # JUnit 6 requires Java 17. Build and run its full suite on 17, then
          # compile and run the README against the packaged library on real JDK 11.
          - runtime: '11'
            build: '17'
          - runtime: '17'
            build: '17'
          - runtime: '25'
            build: '25'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.build }}
          cache: maven

      - name: Verify and resolve runtime classpath
        run: >-
          mvn --batch-mode --no-transfer-progress clean verify
          org.apache.maven.plugins:maven-dependency-plugin:3.7.0:build-classpath
          -DincludeScope=runtime -Dmdep.outputFile=target/runtime-classpath.txt

      - name: Set up Java 11 runtime and compiler
        if: matrix.runtime == '11'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '11'

      - name: Compile README with --release 11 and run on Java ${{ matrix.runtime }}
        run: python3 scripts/readme_smoke.py

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-${{ matrix.runtime }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
